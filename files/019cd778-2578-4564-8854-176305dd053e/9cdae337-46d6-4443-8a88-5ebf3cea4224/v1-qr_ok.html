  const ALPHA='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function shortId(n){let s='';for(let i=0;i<n;i++)s+=ALPHA[Math.floor(Math.random()*ALPHA.length)];return s}
  // Base URL = current page WITHOUT any /s/CODE, ?s=CODE or #s=CODE suffix
  function baseUrl(){
    let u=location.origin+location.pathname;
    // strip trailing /s/CODE
    u=u.replace(/\/s\/[A-Za-z0-9]+\/?$/,'');
    if(!u.endsWith('/')&&!/\.[a-z0-9]+$/i.test(u))u+='/';
    return u;
  }
  // Build a clean short link. If hosted at a domain root (lovable.app etc.), uses /s/CODE.
  // If opened as a local .html file, falls back to ?s=CODE so it still works without a server.
  function buildShortLink(code){
    const path=location.pathname;
    const isFile=/\.html?$/i.test(path)||location.protocol==='file:';
    if(isFile) return location.origin+path+'?s='+code;
    return baseUrl().replace(/\/$/,'')+'/s/'+code;
  }
  function detectCode(){
    let m=location.pathname.match(/\/s\/([A-Za-z0-9]+)\/?$/);
    if(m) return m[1];
    m=location.search.match(/[?&]s=([A-Za-z0-9]+)/);
    if(m) return m[1];
    m=location.hash.match(/^#s=([A-Za-z0-9]+)$/);
    if(m) return m[1];
    return null;
  }

  async function saveToCloud(data,len){
    len=Math.max(4,Math.min(10,parseInt(len)||10));
    for(let i=0;i<8;i++){
      const code=shortId(len);
      const {error}=await sb.from('cards').insert({code,data});
      if(!error) return code;
      if(error.code!=='23505') throw new Error(error.message||'Save failed');
    }
    throw new Error('Could not generate a unique code, please retry.');
  }
  async function loadFromCloud(code){
    const {data,error}=await sb.from('cards').select('data').eq('code',code).maybeSingle();
    if(error) throw new Error(error.message);
    return data?data.data:null;
  }

  function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  function makeQR(text,size){
   try{
    const qr=qrcode(0,'M');qr.addData(text||' ');qr.make();
    const c=qr.getModuleCount(),s=size/c;
    const cv=document.createElement('canvas');cv.width=size;cv.height=size;
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';
    for(let r=0;r<c;r++)for(let col=0;col<c;col++)if(qr.isDark(r,col))ctx.fillRect(col*s,r*s,s,s);
    return cv;
   }catch(e){
    const cv=document.createElement('canvas');cv.width=size;cv.height=size;
    const ctx=cv.getContext('2d');ctx.fillStyle='#eee';ctx.fillRect(0,0,size,size);
    return cv;
   }
  }

  function renderCard(d,el,qrUrl){
   const lines=[];
   if(d.phone)lines.push({k:'phone',v:d.phone});
   if(d.whatsapp)lines.push({k:'whatsapp',v:d.whatsapp});
   if(d.email)lines.push({k:'email',v:d.email});
   if(d.website)lines.push({k:'website',v:d.website});
   if(d.address)lines.push({k:'address',v:d.address});
   const socials=['instagram','facebook','linkedin','twitter','youtube','github'].filter(k=>d[k]);
   const linesH=lines.slice(0,4).map(l=>'<div class="ln">'+ICONS[l.k]+'<span>'+esc(l.v)+'</span></div>').join('');
   const socH=socials.map(k=>'<a href="'+LINKS[k](d[k])+'" target="_blank" rel="noopener">'+ICONS[k]+'</a>').join('');
   el.innerHTML='<div class="card3d"><div class="face" style="background:linear-gradient(135deg,'+(d.color1||'#1a1a2e')+','+(d.color2||'#16213e')+')">'+
    '<div class="nm">'+(esc(d.name)||'Your Name')+'</div>'+
    '<div class="pr">'+(esc(d.profession)||'Profession')+'</div>'+
    linesH+'<div class="sr">'+socH+'</div>'+
    '<div class="brand">'+(esc(d.brand).toUpperCase()||'YOUR BRAND')+'</div>'+
    '<div class="qr"></div></div></div>';
   const qrText=qrUrl||(d.website?LINKS.website(d.website):(d.whatsapp?LINKS.whatsapp(d.whatsapp):(d.phone?LINKS.phone(d.phone):location.href)));
   el.querySelector('.qr').appendChild(makeQR(qrText,130));
   attachRotation(el.querySelector('.card3d'));

  function attachRotation(card){
   if(!card||card._wired)return;card._wired=true;
   let t=0,dragging=false,sx=0,sy=0,offY=0,offX=0,baseY=0,baseX=0;
   const apply=()=>{const y=Math.max(-60,Math.min(60,baseY+offY));const x=Math.max(-25,Math.min(25,baseX+offX));card.style.transform='rotateY('+y+'deg) rotateX('+x+'deg) translateY('+Math.sin(t/40)*-8+'px)'};
   const tick=()=>{if(!dragging){t++;baseY=Math.sin(t/55)*22;baseX=Math.cos(t/70)*10;apply()}requestAnimationFrame(tick)};
   tick();
   const pt=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
   const down=e=>{dragging=true;card.classList.add('dragging');const p=pt(e);sx=p.x;sy=p.y};
   const move=e=>{if(!dragging)return;const p=pt(e);offY=(p.x-sx)*0.4;offX=-(p.y-sy)*0.3;apply();if(e.touches)e.preventDefault()};
   const up=()=>{if(!dragging)return;dragging=false;card.classList.remove('dragging');baseY=Math.max(-60,Math.min(60,baseY+offY));baseX=Math.max(-25,Math.min(25,baseX+offX));offY=0;offX=0};
   card.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
   card.addEventListener('touchstart',down,{passive:true});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',up);
  }

   document.getElementById('gen').onclick=async ()=>{

    try{
     const code=await saveToCloud(data,lenEl.value);
     const shortLink=buildShortLink(code);
     box.style.display='block';
     box.innerHTML='<strong>🔗 SHORT LINK:</strong><br>'+esc(shortLink)+

    finally{btn.disabled=false;btn.textContent='⚡ Generate Cloud Short Link & QR'}
   };
  }

   renderCard(d,document.getElementById('stage'),shareUrl);
   document.getElementById('share').onclick=()=>{
    if(navigator.share)navigator.share({title:(d.name||'Visiting Card'),url:shareUrl}).catch(()=>{});
    else navigator.clipboard.writeText(shareUrl).then(()=>alert('Link copied!'));
   };
  }

  async function boot(){
   const code=detectCode();
   if(code){
    const app=document.getElementById('app');
    app.innerHTML='<div class="loading">⚡ Loading card from cloud…</div>';
    try{
     const data=await loadFromCloud(code);
     if(!data){
      app.innerHTML='<div class="loading" style="color:#f88">Card not found.<br><small>This short link may have expired or never existed.</small><br><br><a class="btn-sec" style="padding:11px 16px;margin-top:14px" href="'+baseUrl()+'">← Create your own</a></div>';
      return;
     }
     viewUI(data);
    }catch(e){
     app.innerHTML='<div class="loading" style="color:#f88">Error loading card: '+esc(e.message)+'<br><br><a class="btn-sec" style="padding:11px 16px" href="'+baseUrl()+'">← Builder</a></div>';
    }
    return;
   }
   builderUI();
  }
  boot();
  window.addEventListener('hashchange',()=>location.reload());

})();
</script>
</body>
</html>
